name: Build BanHammer APK

on:
  workflow_dispatch:
  push:
    paths:
      - "BanHammer/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BanHammer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: BanHammer-apk
          path: BanHammer/app/build/outputs/apk/release/app-release.apk
